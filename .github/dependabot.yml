# Dependabot configuration for BatCoach AI
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Python Backend Dependencies (requirements.txt)
  # STRICTLY FROZEN FOR COMPUTER VISION & ML COMPATIBILITY (Python 3.10)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    # IMMUTABLE ML PINNING: Protect against automated bumps that break VideoMAE, YOLOv8-OBB & MediaPipe
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "torch"
      - dependency-name: "mediapipe"
      - dependency-name: "opencv-python-headless"
      - dependency-name: "transformers"
      - dependency-name: "huggingface_hub"
      - dependency-name: "ultralytics"
      - dependency-name: "protobuf"
      - dependency-name: "pydantic"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # 2. Frontend Next.js & React Dependencies (cricket-coach-ui)
  - package-ecosystem: "npm"
    directory: "/cricket-coach-ui"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps-npm)"
      include: "scope"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # 3. GitHub Actions Workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps-actions)"
      include: "scope"
    groups:
      actions-dependencies:
        patterns:
          - "*"
