name: Security & Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks High-Entropy Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: 🔍 Confidential & .env File Tracker Audit
        run: |
          echo "Auditing Git tree for leaked .env and confidential credential files..."
          
          # Check for forbidden .env files (allow only .example or .template)
          LEAKED_ENV=$(git ls-files | grep -iE '(^|/)\.env(\.[a-zA-Z0-9_-]+)*$' | grep -vE '\.(example|template)$' || true)
          if [ -n "$LEAKED_ENV" ]; then
            echo "❌ CRITICAL SECURITY ERROR: Forbidden .env file is tracked in git repository:"
            echo "$LEAKED_ENV"
            exit 1
          fi

          # Check for private keys, certificates, and cloud credentials
          FORBIDDEN_FILES=$(git ls-files | grep -iE '\.(pem|key|pkcs12|pfx|p12|kdbx)$|id_rsa$|id_ed25519$|service[-_]account.*\.json$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "❌ CRITICAL SECURITY ERROR: Confidential credential/key file found in git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi

          echo "✅ File Tracker Audit Passed: No .env or private key files detected in Git tree."
