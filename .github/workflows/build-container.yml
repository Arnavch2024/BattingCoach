name: Build & Publish Backend Container

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
      - 'coach_backend.py'
      - 'biomechanics.py'
      - '.dockerignore'
      - '.github/workflows/build-container.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual container build'
        required: false
        default: 'Manual deployment trigger'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/batcoach-backend

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build and Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: 🚢 Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🔐 Azure Login
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔍 Discover Resource Group
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        id: discover-rg
        run: |
          if [ -n "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            echo "rg=${{ secrets.AZURE_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT
          else
            RG=$(az containerapp list --query "[?name=='bat-coach'].resourceGroup" -o tsv | head -n 1)
            echo "Auto-detected Resource Group: $RG"
            echo "rg=$RG" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy Updated Image to Azure
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ghcr.io/${{ env.IMAGE_NAME }}:latest
          containerAppName: bat-coach
          resourceGroup: ${{ steps.discover-rg.outputs.rg }}

      - name: ℹ️ Instructions if Azure Secret is not set
        if: "${{ secrets.AZURE_CREDENTIALS == '' }}"
        run: |
          echo "::notice title=Azure Continuous Deployment::Image was successfully built and published to GHCR. To enable automatic zero-click deployment to Azure Container Apps, add AZURE_CREDENTIALS to your GitHub Repository Secrets."
