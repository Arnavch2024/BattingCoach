name: Frontend CI (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'cricket-coach-ui/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cricket-coach-ui/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Type-Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cricket-coach-ui

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8888
      NEXT_PUBLIC_WS_URL: ws://localhost:8888/ws
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'cricket-coach-ui/package-lock.json'

      - name: ⚡ Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: cricket-coach-ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('cricket-coach-ui/package-lock.json') }}-${{ hashFiles('cricket-coach-ui/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('cricket-coach-ui/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Next.js Production Build & TypeScript Verification
        run: npm run build
