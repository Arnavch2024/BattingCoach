name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build & Type-Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cricket-coach-ui

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:8888
      NEXT_PUBLIC_WS_URL: ws://localhost:8888/ws
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'cricket-coach-ui/package-lock.json'

      - name: ⚡ Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: cricket-coach-ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('cricket-coach-ui/package-lock.json') }}-${{ hashFiles('cricket-coach-ui/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('cricket-coach-ui/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 📦 Install Dependencies
        run: npm ci --include=dev

      - name: 🏗️ Next.js Production Build & TypeScript Verification
        run: npm run build

  biomechanics-tests:
    name: Biomechanical Vector & Angle Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: 🧪 Run Biomechanical Math & Rule Engine Tests
        run: |
          python -m pytest tests/test_biomechanics.py -v
